<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>簇 1 Demo 1 — SSE 体验</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    h1   { font-size: 20px; }
    .box { border: 1px solid #ddd; border-radius: 8px; padding: 16px; min-height: 200px; background: #fafafa; }
    .msg { padding: 4px 0; color: #333; font-family: ui-monospace, Consolas, monospace; }
    .meta { color: #888; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>簇 1 Demo 1 — 浏览器原生 EventSource 接收 SSE</h1>
  <div class="box" id="box"></div>
  <div class="meta" id="meta">未连接</div>

  <script>
    const box  = document.getElementById('box');
    const meta = document.getElementById('meta');

    // 关键 API：浏览器原生 EventSource —— 一行代码搞定订阅
    const es = new EventSource('/events');

    es.onopen = () => {
      meta.textContent = '✅ 已连接，等待消息…';
    };

    // 收到一条 data: ... 时触发
    es.onmessage = (e) => {
      const div = document.createElement('div');
      div.className = 'msg';
      div.textContent = `← ${e.data}`;
      box.appendChild(div);
    };

    es.onerror = () => {
      meta.textContent = '❌ 连接出错，浏览器会自动重连';
    };
  </script>
</body>
</html>
